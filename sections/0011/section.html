<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CTA Banner — ACME Everything</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-body, -apple-system, BlinkMacSystemFont, system-ui, sans-serif);
    background: #0d1117;
    -webkit-font-smoothing: antialiased;
  }
  img { max-width: 100%; display: block; }

:root {
  --bg:           #080808;
  --surface:      #101010;
  --card:         #181818;
  --card-hover:   #1e1e1e;
  --border:       #222222;
  --border-mid:   #2a2a2a;

  --accent:       #1d4ed8;
  --accent-dark:  #1e40af;
  --accent-light: #93c5fd;
  --accent-glow:  rgba(29, 78, 216, 0.12);
  --accent-border:rgba(29, 78, 216, 0.28);

  --gold:         #f59e0b;
  --gold-glow:    rgba(245, 158, 11, 0.12);
  --gold-border:  rgba(245, 158, 11, 0.28);

  --white:        #ffffff;
  --text:         #f0f0f0;
  --silver:       #9ca3af;
  --muted:        #6b7280;
  --dim:          #4b5563;

  /* 4dp spacing grid */
  --s1:  0.25rem;
  --s2:  0.5rem;
  --s3:  0.75rem;
  --s4:  1rem;
  --s5:  1.25rem;
  --s6:  1.5rem;
  --s8:  2rem;
  --s10: 2.5rem;
  --s12: 3rem;
  --s16: 4rem;
  --s20: 5rem;
  --s24: 6rem;
  --s32: 8rem;

  /* Radius */
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --r-xl: 20px;
  --r-2xl:28px;
  --r-full: 9999px;

  /* Transitions */
  --ease:      0.3s cubic-bezier(0.4, 0, 0.2, 1);
  --ease-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);

  /* Shadows */
  --shadow-card: 0 4px 24px rgba(0,0,0,0.4);
  --shadow-blue: 0 0 32px rgba(29,78,216,0.18);
  --shadow-up:   0 -8px 32px rgba(0,0,0,0.3);
}

.container { max-width: 1160px; margin: 0 auto; padding: 0 var(--s6); }

.label-tag {
  display: inline-block;
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--accent-light);
  margin-bottom: var(--s3);
}

.btn {
  display: inline-flex; align-items: center; gap: var(--s2);
  padding: 0.75rem 1.75rem;
  border-radius: var(--r-full);
  font-size: 0.9rem; font-weight: 700;
  border: 2px solid transparent;
  transition: var(--ease);
  white-space: nowrap;
  line-height: 1;
}

.btn-primary {
  background: var(--accent); color: var(--white); border-color: var(--accent);
}

.btn-primary:hover {
  background: var(--accent-dark); border-color: var(--accent-dark);
  transform: translateY(-2px); box-shadow: var(--shadow-blue);
}

.btn-ghost {
  background: transparent; color: var(--white); border-color: var(--border-mid);
}

.btn-ghost:hover {
  border-color: var(--silver); background: rgba(255,255,255,0.05);
  transform: translateY(-2px);
}

.btn-lg { padding: 1rem 2.25rem; font-size: 1rem; }

.about-content .label-tag { display: block; }

.cta-banner {
  background: linear-gradient(120deg, #0c1a38 0%, #080808 55%, #0c1a38 100%);
  border-top: 1px solid var(--accent-border);
  border-bottom: 1px solid var(--accent-border);
  padding: var(--s24) 0; text-align: center;
  position: relative; overflow: hidden;
}

.cta-banner::before {
  content: ''; position: absolute; top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  width: 800px; height: 400px;
  background: radial-gradient(ellipse, rgba(29,78,216,0.1) 0%, transparent 70%);
  pointer-events: none;
}

.cta-banner h2 { color: var(--white); margin-bottom: var(--s4); position: relative; }

.cta-banner p  { max-width: 500px; margin: 0 auto var(--s8); font-size: 1.05rem; position: relative; }

.cta-btns { display: flex; gap: var(--s4); justify-content: center; flex-wrap: wrap; position: relative; }

.page-hero .label-tag { display: block; }

@media (prefers-reduced-motion: reduce) {
.fade-up, .fade-in, .slide-r, .slide-l { opacity: 1 !important; transform: none !important; }
}

@media (max-width: 768px) {
.insta-cta .btn { width: 100%; justify-content: center; }
.cta-btns       { flex-direction: column; align-items: center; }
}

/* --- library override: this file has no page JS, so force any
   scroll/load-triggered reveal state to its visible end-state instead of
   sitting at its JS-driven opacity:0 starting state. The target site's own
   script still drives the real animation once this is pulled in. --- */
.hero-line, .hero__dek, .hero__actions,
[data-reveal], .reveal, .lift, .fade-up,
.tier, .package, .service-feature, .stat {
  opacity: 1 !important;
  transform: none !important;
}
</style>
</head>
<body class="no-js">
<section class="cta-banner" aria-labelledby="cta-heading">
      <div class="container">
        <div style="display:inline-flex; align-items:center; gap:.55rem; margin-bottom:1.1rem;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.5" aria-hidden="true"><rect x="4" y="4" width="16" height="16" transform="rotate(45 12 12)"/></svg>
          <span style="font-weight:700; letter-spacing:.08em; text-transform:uppercase; font-size:.85rem; color:var(--white);">Acme Everything</span>
        </div>
        <span class="label-tag fade-up" style="display:block;margin-bottom:1rem;">Ready to Book?</span>
        <h2 id="cta-heading" class="fade-up">Your Car Deserves This.</h2>
        <p class="fade-up">Call or text us directly, or fill out our quick booking form. We'll confirm your appointment and show up ready to work.</p>
        <div class="cta-btns fade-up">
          <a href="contact.html" class="btn btn-primary btn-lg">Book Online Now</a>
          <a href="tel:5550100" class="btn btn-ghost btn-lg">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.61 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            Call (555) 010-0100
          </a>
        </div>
      </div>
    </section>

</body>
</html>
