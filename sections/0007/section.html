<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CTA Dark — ACME Everything</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-body, -apple-system, BlinkMacSystemFont, system-ui, sans-serif);
    background: #12130f;
    -webkit-font-smoothing: antialiased;
  }
  img { max-width: 100%; display: block; }

/* --- restored :root — see sections/0006 for why this was missing --- */
:root {
  --ink:        #142A1E;
  --ink-soft:   #1D3527;
  --paper:      #FBF6EA;
  --paper-line: #E6DFC7;
  --wood-tint:  #F1E3CC;
  --green:      #1F5C3B;
  --green-hi:   #276E48;
  --wood:       #9C6B3E;
  --wood-deep:  #7A4F2C;
  --muted:      #675E4C;
  --star:       #B08A3E;
  --star-on-light: #836227;

  --font-display: 'Fraunces', serif;
  --font-body: 'Inter', sans-serif;

  --space-s:  clamp(1.25rem, 4vw, 1.5rem);
  --space-m:  clamp(2rem, 4vw, 3rem);
  --space-l:  clamp(3rem, 7vh, 5.5rem);
  --space-xl: clamp(4.5rem, 11vh, 8rem);

  --container: 1240px;
  --radius: 4px;
}

.muted { color: var(--muted); }

.container { max-width: var(--container); margin: 0 auto; padding: 0 var(--space-s); }

.btn {
  display: inline-flex; align-items: center; gap: .5em;
  font-weight: 700; font-size: .95rem; letter-spacing: .01em;
  padding: .95em 1.7em; border-radius: 2px; border: 1px solid transparent;
  cursor: pointer; white-space: nowrap;
  transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
}

.btn-primary { background: var(--green); color: #fff; box-shadow: 0 8px 20px -8px rgba(11,74,46,.55); }

.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 14px 28px -8px rgba(11,74,46,.65); background: var(--green-hi); }

.btn-ghost { background: transparent; border-color: currentColor; color: var(--ink); }

.btn-ghost:hover { background: var(--ink); color: var(--paper); }

.btn:active { transform: scale(.98); }

.hero-actions { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; }

.hero-panel .btn-ghost { border-color: rgba(255,255,255,.55); color: #fff; }

.hero-panel .btn-ghost:hover { background: #fff; color: var(--ink); }

.section-tight { padding: var(--space-l) 0; }

.section-dark { background: var(--ink); color: #fff; }

.section-dark h2, .section-dark h3 { color: #fff; }

.section-dark .kicker { color: #BFE0CC; }

.quote-lead .attribution .muted { color: #B9B2A0; font-weight: 400; display: block; font-size: .85rem; margin-top: .2rem; }

.quote-card .attribution .muted { font-weight: 400; display: block; font-size: .82rem; margin-top: .15rem; }

/* --- library override: this file has no page JS, so force any
   scroll/load-triggered reveal state to its visible end-state instead of
   sitting at its JS-driven opacity:0 starting state. The target site's own
   script still drives the real animation once this is pulled in. --- */
.hero-line, .hero__dek, .hero__actions,
[data-reveal], .reveal, .lift, .fade-up,
.tier, .package, .service-feature, .stat {
  opacity: 1 !important;
  transform: none !important;
}
</style>
</head>
<body class="no-js">
<section class="section-dark section-tight">
    <div class="container" style="text-align:center;">
      <div style="display:inline-flex; align-items:center; gap:.5rem; margin-bottom:1.4rem;">
        <span style="width:1.6rem; height:1.6rem; border:2px solid var(--green); border-radius:2px; display:inline-flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:900; font-size:.85rem; color:var(--green);">A</span>
        <span style="font-family:var(--font-body); font-weight:700; letter-spacing:.02em; font-size:.95rem; color:#fff;">Acme Everything</span>
      </div>
      <h2>Ready to Get Your Fence Fixed or Built?</h2>
      <p class="muted" style="color:#D7E4DB; max-width:52ch; margin:0 auto 1.5rem;">Call now, or request a quote and we'll follow up during business hours.</p>
      <div class="hero-actions" style="justify-content:center;">
        <a href="tel:+15550100" class="btn btn-primary" style="background:#fff; color:var(--ink);">Call (555) 010-0100</a>
        <a href="contact.html" class="btn btn-ghost" style="border-color:#fff; color:#fff;">Request Your Bid</a>
      </div>
    </div>
  </section>

</body>
</html>
