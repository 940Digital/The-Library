<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Before / after — Acme Everything</title>
<meta name="description" content="Demo of a before-and-after image slider. The pictures are placeholder diagrams, not a finished project.">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.5;
    color-scheme: light;
    -webkit-font-smoothing: antialiased;
  }
  h1, p { margin: 0; }
  .page {
    width: min(100% - 2.5rem, 60rem);
    margin: 0 auto;
    padding: 1.75rem 0 3rem;
  }
  .mark { font-weight: 700; letter-spacing: -0.03em; margin-bottom: 0.85rem; }
  .mark span { color: var(--brand); }
  .kicker {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--brand);
    margin-bottom: 0.55rem;
  }
  h1 {
    font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
    font-weight: 600;
    font-size: clamp(2rem, 4vw, 3.25rem);
    line-height: 1.05;
    letter-spacing: -0.03em;
    max-width: 16ch;
  }
  .lede {
    max-width: 38rem;
    color: var(--muted);
    font-size: 1.05rem;
    margin: 0.85rem 0 1.25rem;
  }

  /* ============================================================
     COPY START: before / after compare
     Theme --brand (the knob and focus) and --accent if you recolor
     the focus ring. Both images share width, height, and crop.
     The 8-line script moves the split. Without it, the view stays
     at halfway, which is still readable.
     --thumb must match the knob and the range thumb (44px).
     0 and 100 sit half a knob in from the frame so the handle
     never hangs off the rounded corner.
     ============================================================ */
  :root {
    --brand: #14352c;
    --accent: #e0a04a;
    --on-brand: #f6f3ea;
    --ink: #1c1915;
    --muted: #4a453c;
    --paper: #f4f0e6;
    --line: #e0d8cb;
  }

  .cmp { width: min(100%, 56rem); margin: 0 auto; }
  .cmp__stage {
    position: relative;
    --val: 50;
    --thumb: 44px;
    /* Same math the browser uses to place a 44px range thumb, so the
       line stays under the handle instead of drifting at the ends. */
    --pos: calc(var(--thumb) / 2 + (100% - var(--thumb)) * var(--val) / 100);
    user-select: none;
  }
  .cmp__frame {
    position: relative;
    aspect-ratio: 3 / 2;
    overflow: hidden;
    border-radius: 1rem;
    background: #d9d2c4;
  }
  .cmp__stage:focus-within .cmp__frame {
    outline: 3px solid var(--brand);
    outline-offset: 4px;
  }
  .cmp__layer { position: absolute; inset: 0; }
  .cmp__layer--before { clip-path: inset(0 calc(100% - var(--pos)) 0 0); }
  .cmp__img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .cmp__tag {
    position: absolute;
    top: 0.75rem;
    z-index: 1;
    padding: 0.4rem 0.7rem;
    border-radius: 999px;
    background: rgba(28, 25, 21, 0.78);
    color: var(--on-brand);
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    line-height: 1;
    pointer-events: none;
  }
  .cmp__layer--before .cmp__tag { left: 0.75rem; }
  .cmp__layer--after .cmp__tag { right: 0.75rem; }

  .cmp__range {
    position: absolute;
    inset: 0;
    z-index: 3;
    width: 100%;
    height: 100%;
    margin: 0;
    background: transparent;
    appearance: none;
    -webkit-appearance: none;
    cursor: ew-resize;
    /* Vertical pans scroll the page. Horizontal drags move the split. */
    touch-action: pan-y;
    opacity: 0;
  }
  .cmp__range::-webkit-slider-runnable-track {
    height: 100%;
    background: transparent;
    border: 0;
  }
  .cmp__range::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: var(--thumb);
    height: 100%;
    background: transparent;
    border: 0;
    cursor: ew-resize;
  }
  .cmp__range::-moz-range-track {
    height: 100%;
    background: transparent;
    border: 0;
  }
  .cmp__range::-moz-range-thumb {
    width: var(--thumb);
    height: 100%;
    background: transparent;
    border: 0;
    cursor: ew-resize;
  }
  .cmp__range:focus { outline: none; }

  .cmp__seam {
    position: absolute;
    top: 0;
    bottom: 0;
    left: var(--pos);
    z-index: 4;
    width: 2px;
    margin-left: -1px;
    background: #fff;
    box-shadow: 0 0 0 1px rgba(20, 24, 18, 0.28);
    pointer-events: none;
  }
  .cmp__seam * { pointer-events: none; }
  .cmp__knob {
    position: absolute;
    left: 50%;
    top: 50%;
    box-sizing: border-box;
    width: var(--thumb);
    height: var(--thumb);
    margin: calc(var(--thumb) / -2) 0 0 calc(var(--thumb) / -2);
    border-radius: 50%;
    background: #fff;
    border: 3px solid var(--brand);
    box-shadow: 0 6px 16px rgba(20, 24, 18, 0.28);
  }
  .cmp__range:focus-visible ~ .cmp__seam .cmp__knob {
    box-shadow: 0 0 0 3px var(--paper), 0 0 0 6px var(--brand);
  }
  .cmp__knob i {
    position: absolute;
    top: 50%;
    width: 7px;
    height: 7px;
    margin-top: -4px;
    border-top: 2px solid var(--brand);
    border-right: 2px solid var(--brand);
  }
  .cmp__knob i.l { left: 11px; transform: rotate(-135deg); }
  .cmp__knob i.r { right: 11px; transform: rotate(45deg); }

  .cmp__readout {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    margin: 0.8rem 0 0;
    font-variant-numeric: tabular-nums;
    font-size: 0.8125rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .cmp__readout b {
    display: inline-block;
    min-width: 3ch;
    color: var(--ink);
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0;
    font-variant-numeric: tabular-nums;
  }
  .cmp__help {
    margin: 0.45rem 0 0;
    color: var(--muted);
    font-size: 0.95rem;
    max-width: 42rem;
  }
  .u-sr {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }
  @media (forced-colors: active) {
    .cmp__seam, .cmp__knob { forced-color-adjust: none; background: Canvas; border-color: CanvasText; }
    .cmp__knob i { border-color: CanvasText; }
  }
  /* The split is user-driven, not decorative, so reduced motion does not remove it. */
  /* COPY END: before / after compare */
</style>
</head>
<body>
<div class="page">
  <header>
    <p class="mark"><span>Acme</span> Everything</p>
    <p class="kicker">Before / after</p>
    <h1>Drag across the two drawings.</h1>
    <p class="lede">Same house, two versions of the yard. These are placeholder diagrams, not a photograph and not a finished job.</p>
  </header>

  <!-- COPY START: before / after compare
       Keep the two images the same pixel size. Swap both src and alt
       for the client's real pair. loading="lazy" is right when this
       sits below the first screen; if it is the hero, set the top
       image to loading="eager". -->
  <div class="cmp" data-compare>
    <div class="cmp__stage">
      <div class="cmp__frame">
        <div class="cmp__layer cmp__layer--after">
          <!-- LIBRARY PLACEHOLDER: drawn diagram, swap for the target site's own after photo -->
          <img class="cmp__img" src="../../assets/placeholders/compare-after.svg" width="1200" height="800" alt="Placeholder diagram of the same house with a lawn, a fuller tree, shrubs, and a path. Stamped placeholder, not a photograph of finished work." loading="lazy" decoding="async">
          <span class="cmp__tag">After</span>
        </div>
        <div class="cmp__layer cmp__layer--before">
          <!-- LIBRARY PLACEHOLDER: drawn diagram, swap for the target site's own before photo -->
          <img class="cmp__img" src="../../assets/placeholders/compare-before.svg" width="1200" height="800" alt="Placeholder diagram of a house with bare ground, a thin tree, and an empty planting bed. Stamped placeholder, not a photograph of finished work." loading="lazy" decoding="async">
          <span class="cmp__tag">Before</span>
        </div>
      </div>
      <label class="u-sr" for="compare">Before and after position. Left shows more of the before drawing, right shows more of the after drawing.</label>
      <input class="cmp__range" id="compare" type="range" min="0" max="100" step="1" value="50" aria-describedby="compare-help" aria-valuetext="50% before, 50% after">
      <div class="cmp__seam" aria-hidden="true"><span class="cmp__knob"><i class="l"></i><i class="r"></i></span></div>
    </div>
    <p class="cmp__readout" aria-hidden="true">
      <span><b id="compare-before-val">50</b>% before</span>
      <span><b id="compare-after-val">50</b>% after</span>
    </p>
    <p class="cmp__help" id="compare-help">Drag the handle, or focus it and use the arrow keys. Home and End jump to either side.</p>
  </div>
  <!-- COPY END: before / after compare -->
</div>

<script>
/* COPY START: before / after compare
   Sets one custom property. The clip and the seam both read it. */
(function () {
  var root = document.querySelector("[data-compare]");
  if (!root) return;
  var stage = root.querySelector(".cmp__stage");
  var range = root.querySelector("input[type=range]");
  var beforeVal = document.getElementById("compare-before-val");
  var afterVal = document.getElementById("compare-after-val");
  function paint() {
    var value = Number(range.value);
    stage.style.setProperty("--val", String(value));
    if (beforeVal) beforeVal.textContent = String(value);
    if (afterVal) afterVal.textContent = String(100 - value);
    range.setAttribute("aria-valuetext", value + "% before, " + (100 - value) + "% after");
  }
  range.addEventListener("input", paint);
  paint();
})();
/* COPY END: before / after compare */
</script>
</body>
</html>
