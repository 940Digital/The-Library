<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>940Digital Hero 05 | What you are actually buying</title>
<meta name="description" content="A website is five layers of work, not one picture. 940Digital builds websites and search presence for small businesses in Dallas-Fort Worth and Denton.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   940DIGITAL HERO 05 - "THE CUTAWAY"
   Thesis: you are not buying a picture, you are buying five
   layers of work, and here they are pulled apart so you can
   count them.
   Signature effect: an orthographic exploded diagram. No
   perspective, no cursor tilt, no 3D transforms. Flat 2:1
   isometric SVG that separates once on load, then responds
   precisely when you point at any layer's name.
   ============================================================ */

:root {
  --charcoal:      #1B1D21;
  --charcoal-lift: #212429;
  --charcoal-edge: #2E333A;
  --blue:          #3194E0;
  --sand:          #F7F1E7;
  --white:         #FFFFFF;
  --grey:          #A8B0BA;   /* 7.70:1 */
  --grey-quiet:    #8A9099;   /* 5.25:1 */

  --font-display: 'Plus Jakarta Sans', system-ui, sans-serif;
  --font-mono:    'JetBrains Mono', ui-monospace, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--charcoal);
  font-family: var(--font-display);
  -webkit-font-smoothing: antialiased;
}

.hero {
  position: relative;
  min-height: 100svh;
  display: flex; flex-direction: column;
  background: var(--charcoal);
  color: var(--white);
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(880px 700px at 72% 44%, rgba(49,148,224,.11), transparent 66%);
  pointer-events: none;
}

.wrap { position: relative; width: 100%; max-width: 1260px; margin: 0 auto; padding: 0 32px; }

.masthead { padding: 30px 0 0; }
.wordmark { display: inline-flex; align-items: baseline; gap: 1px; font-size: 20px; letter-spacing: -0.02em; text-decoration: none; }
.wm-num    { font-weight: 700; color: var(--white); }
.wm-script { font-family: var(--font-mono); font-weight: 500; color: var(--blue); }

.core {
  flex: 1;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr);
  align-items: center;
  gap: 56px;
  padding: 48px 0 40px;
}

.eyebrow {
  font-family: var(--font-mono);
  font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--blue); margin: 0 0 20px;
}
h1 {
  margin: 0 0 20px;
  font-size: clamp(2.1rem, 3.8vw, 3.15rem);
  font-weight: 500; line-height: 1.08; letter-spacing: -0.032em;
  max-width: 16ch;
}
.lede {
  margin: 0 0 26px;
  font-size: 1.0625rem; line-height: 1.6;
  color: var(--grey); max-width: 44ch;
}

/* ---------- the layer list: real text, and the control surface ---------- */
.layers { list-style: none; margin: 0 0 30px; padding: 0; }
.layers li { border-top: 1px solid var(--charcoal-edge); }
.layers li:last-child { border-bottom: 1px solid var(--charcoal-edge); }

.layer-btn {
  width: 100%;
  display: grid;
  grid-template-columns: 26px 1fr auto;
  align-items: baseline;
  gap: 14px;
  padding: 13px 4px;
  background: none;
  border: 0;
  text-align: left;
  color: inherit;
  font: inherit;
  cursor: default;
  transition: background .18s ease;
}
.layer-btn:hover,
.layer-btn:focus-visible,
.layer-btn.active {
  background: rgba(49,148,224,.09);
  outline: none;
}
.layer-btn:focus-visible { box-shadow: inset 2px 0 0 var(--blue); }
.layer-btn.active        { box-shadow: inset 2px 0 0 var(--blue); }

.layer-n {
  font-family: var(--font-mono);
  font-size: 10.5px; letter-spacing: 0.06em;
  color: var(--blue);
}
.layer-name {
  font-size: 0.9375rem; font-weight: 600; letter-spacing: -0.01em;
  color: var(--white);
}
.layer-what {
  display: block;
  font-size: 0.8125rem; font-weight: 400; line-height: 1.5;
  color: var(--grey-quiet);
  margin-top: 3px;
}
.layer-btn:hover .layer-what,
.layer-btn.active .layer-what { color: var(--grey); }

.layer-tag {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-size: 10.5px; letter-spacing: 0.06em;
  color: var(--grey-quiet);
  white-space: nowrap;
}

.actions { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center;
  background: var(--blue); color: var(--charcoal);   /* 5.18:1 */
  font-weight: 700; font-size: 0.95rem; letter-spacing: -0.01em;
  padding: 13px 24px; border-radius: 6px; text-decoration: none;
  transition: background .16s ease, transform .16s ease;
}
.btn:hover { background: #46A2E8; transform: translateY(-1px); }
.btn:focus-visible { outline: 2px solid var(--white); outline-offset: 3px; }
.link-quiet {
  font-size: 0.9375rem; color: var(--grey); text-decoration: none;
  border-bottom: 1px solid rgba(168,176,186,.35); padding-bottom: 2px;
}
.link-quiet:hover { color: var(--white); border-color: var(--white); }

/* ============================================================
   THE DIAGRAM
   ============================================================ */
.cut { position: relative; }
.cut svg { width: 100%; height: auto; display: block; }

.plane-top   { fill: rgba(49,148,224,.10); stroke: var(--blue); stroke-width: 1.2; }
.plane-side  { fill: rgba(255,255,255,.035); stroke: rgba(255,255,255,.20); stroke-width: 1; }
.plane-mark  { stroke: rgba(255,255,255,.28); stroke-width: 1; fill: none; }
.plane-chip  { fill: rgba(49,148,224,.55); }
.spine       { stroke: rgba(255,255,255,.16); stroke-width: 1; stroke-dasharray: 2 4; }

/* The separation itself. Each layer slides to its resting altitude once,
   staggered from the bottom up so the stack reads as being lifted apart
   rather than dropped. */
.layer-g {
  transform: translateY(var(--rest, 0px));
  opacity: 0;
  transition:
    transform .34s cubic-bezier(.22,1,.36,1),
    opacity   .34s ease;
}
.cut.go .layer-g {
  opacity: 1;
  transform: translateY(0);
  transition-delay: var(--d, 0s);
}
/* Pointing at a layer's name lifts that one plane a little further and
   dims the others. Precise, and it answers the exact thing being asked. */
.cut[data-focus] .layer-g { opacity: .32; }
.cut[data-focus] .layer-g.lit {
  opacity: 1;
  transform: translate(-10px, -8px);
}

.cut-cap {
  margin: 16px 0 0;
  font-family: var(--font-mono);
  font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--grey-quiet);
  text-align: center;
}

@media (max-width: 980px) {
  .core { grid-template-columns: 1fr; gap: 40px; padding: 36px 0 32px; }
  h1 { max-width: 19ch; }
  .cut { order: 2; max-width: 460px; margin: 0 auto; width: 100%; }
}
@media (max-width: 560px) {
  .wrap { padding: 0 18px; }
  h1 { font-size: 1.95rem; }
  .layer-btn { grid-template-columns: 22px 1fr; gap: 10px; }
  .layer-tag { display: none; }
  .btn { width: 100%; justify-content: center; }
  .actions { gap: 18px; }
}

@media (prefers-reduced-motion: reduce) {
  .layer-g {
    transition: none !important;
    opacity: 1 !important;
    transform: translateY(0) !important;
  }
  .cut[data-focus] .layer-g { opacity: .4; }
  .cut[data-focus] .layer-g.lit { opacity: 1; transform: translateY(0) !important; }
  .btn:hover { transform: none; }
}
</style>
</head>
<body>

<section class="hero">

  <header class="masthead">
    <div class="wrap">
      <a href="/" class="wordmark" aria-label="940Digital home">
        <span class="wm-num">940</span><span class="wm-script">Digital</span>
      </a>
    </div>
  </header>

  <div class="wrap core">

    <div class="say">
      <p class="eyebrow">Denton &amp; Dallas-Fort Worth</p>

      <h1>A website is five layers of work, not one picture.</h1>

      <p class="lede">
        Most quotes hide what is underneath. Here is the whole stack pulled
        apart. Point at any layer and it will show you where it sits.
      </p>

      <ul class="layers" id="layers">
        <li>
          <button class="layer-btn" type="button" data-layer="1">
            <span class="layer-n">01</span>
            <span class="layer-name">What it says
              <span class="layer-what">Your services, your prices, your words. Written, not filled in.</span>
            </span>
            <span class="layer-tag">Copy</span>
          </button>
        </li>
        <li>
          <button class="layer-btn" type="button" data-layer="2">
            <span class="layer-n">02</span>
            <span class="layer-name">How it is built
              <span class="layer-what">Real headings, clean markup, and a layout that holds on any screen.</span>
            </span>
            <span class="layer-tag">Structure</span>
          </button>
        </li>
        <li>
          <button class="layer-btn" type="button" data-layer="3">
            <span class="layer-n">03</span>
            <span class="layer-name">How fast it loads
              <span class="layer-what">Compressed images and no bloat. Slow pages lose the call.</span>
            </span>
            <span class="layer-tag">Speed</span>
          </button>
        </li>
        <li>
          <button class="layer-btn" type="button" data-layer="4">
            <span class="layer-n">04</span>
            <span class="layer-name">Whether anyone finds it
              <span class="layer-what">Search setup and a Google Business Profile that agrees with the site.</span>
            </span>
            <span class="layer-tag">Search</span>
          </button>
        </li>
        <li>
          <button class="layer-btn" type="button" data-layer="5">
            <span class="layer-n">05</span>
            <span class="layer-name">What happens after
              <span class="layer-what">Hosting, edits, and someone who picks up when you call.</span>
            </span>
            <span class="layer-tag">Upkeep</span>
          </button>
        </li>
      </ul>

      <div class="actions">
        <a class="btn" href="/contact">Get all five</a>
        <a class="link-quiet" href="/services">How each layer works</a>
      </div>
    </div>

    <figure class="cut" id="cut">
      <!-- The diagram repeats the list beside it, so it is described once for
           assistive technology and otherwise left alone. -->
      <!-- Measured content box is x 120-400, y 6-480. The viewBox is fitted to
           that with a 16 unit margin, so the stack fills its column instead of
           floating in 240 units of dead space, and the bottom plate is not
           clipped. -->
      <svg viewBox="104 -10 312 506" role="img"
           aria-label="An exploded isometric diagram showing five stacked layers of a website build, separated vertically. From the top down: what it says, how it is built, how fast it loads, whether anyone finds it, and what happens after.">

        <!-- a dashed spine running through all five, so they read as one
             object that has been opened rather than five loose plates -->
        <line class="spine" x1="260" y1="86" x2="260" y2="420"/>

        <!-- Layer 5, bottom. --rest is where it starts before separating. -->
        <g class="layer-g" data-layer="5" style="--rest:-104px;--d:.05s">
          <path class="plane-side" d="M120 396 L260 466 L400 396 L400 410 L260 480 L120 410 Z"/>
          <path class="plane-top"  d="M120 396 L260 326 L400 396 L260 466 Z"/>
          <path class="plane-mark" d="M196 396 L260 364 L324 396 L260 428 Z"/>
        </g>

        <g class="layer-g" data-layer="4" style="--rest:-78px;--d:.12s">
          <path class="plane-side" d="M120 316 L260 386 L400 316 L400 330 L260 400 L120 330 Z"/>
          <path class="plane-top"  d="M120 316 L260 246 L400 316 L260 386 Z"/>
          <circle class="plane-chip" cx="260" cy="316" r="5"/>
          <path class="plane-mark" d="M180 316 L260 276 M340 316 L260 276 M180 316 L260 356 M340 316 L260 356"/>
        </g>

        <g class="layer-g" data-layer="3" style="--rest:-52px;--d:.19s">
          <path class="plane-side" d="M120 236 L260 306 L400 236 L400 250 L260 320 L120 250 Z"/>
          <path class="plane-top"  d="M120 236 L260 166 L400 236 L260 306 Z"/>
          <path class="plane-mark" d="M164 236 L232 202 M196 252 L264 218 M228 268 L296 234"/>
        </g>

        <g class="layer-g" data-layer="2" style="--rest:-26px;--d:.26s">
          <path class="plane-side" d="M120 156 L260 226 L400 156 L400 170 L260 240 L120 170 Z"/>
          <path class="plane-top"  d="M120 156 L260 86 L400 156 L260 226 Z"/>
          <path class="plane-mark" d="M160 156 L260 106 L360 156 L260 206 Z M210 131 L310 181 M210 181 L310 131"/>
        </g>

        <g class="layer-g" data-layer="1" style="--rest:0px;--d:.33s">
          <path class="plane-side" d="M120 76 L260 146 L400 76 L400 90 L260 160 L120 90 Z"/>
          <path class="plane-top"  d="M120 76 L260 6 L400 76 L260 146 Z"/>
          <rect class="plane-chip" x="212" y="60" width="52" height="7" rx="3" transform="rotate(-26.5 238 63)"/>
          <rect class="plane-chip" x="236" y="86" width="36" height="6" rx="3" opacity=".6" transform="rotate(-26.5 254 89)"/>
        </g>
      </svg>

      <figcaption class="cut-cap">Every build ships all five</figcaption>
    </figure>

  </div>

</section>

<script>
(function () {
  var cut    = document.getElementById('cut');
  var list   = document.getElementById('layers');
  var groups = Array.prototype.slice.call(cut.querySelectorAll('.layer-g'));
  var btns   = Array.prototype.slice.call(list.querySelectorAll('.layer-btn'));
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

  function separate() { cut.classList.add('go'); }

  if (reduce.matches || !('IntersectionObserver' in window)) {
    separate();
  } else {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { separate(); io.disconnect(); }
      });
    }, { threshold: 0.25 });
    io.observe(cut);
  }

  function light(n) {
    if (n) {
      cut.setAttribute('data-focus', n);
    } else {
      cut.removeAttribute('data-focus');
    }
    groups.forEach(function (g) {
      g.classList.toggle('lit', !!n && g.getAttribute('data-layer') === n);
    });
    btns.forEach(function (b) {
      b.classList.toggle('active', !!n && b.getAttribute('data-layer') === n);
    });
  }

  btns.forEach(function (b) {
    var n = b.getAttribute('data-layer');
    /* Pointer and keyboard are wired to the same call, so tabbing through the
       list drives the diagram exactly the way hovering does. */
    b.addEventListener('mouseenter', function () { light(n); });
    b.addEventListener('focus',      function () { light(n); });
    b.addEventListener('mouseleave', function () { light(null); });
    b.addEventListener('blur',       function () { light(null); });
    /* Touch has no hover. A tap latches the layer, a second tap releases it. */
    b.addEventListener('click', function () {
      light(cut.getAttribute('data-focus') === n ? null : n);
    });
  });

  list.addEventListener('mouseleave', function () { light(null); });
})();
</script>

</body>
</html>
